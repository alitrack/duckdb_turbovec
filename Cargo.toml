[package]
name = "duckdb_turbovec"
version = "0.1.0"
edition = "2021"
description = "DuckDB extension for compressed vector search using Google's TurboQuant (turbovec)"
license = "MIT"
repository = "https://github.com/alitrack/duckdb_turbovec"

[lib]
name = "turbovec"
crate-type = ["cdylib", "rlib"]

[profile.release]
lto = true
strip = true

