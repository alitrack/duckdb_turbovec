name: Build

on: [push, pull_request]

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release
      - run: python3 scripts/metadata.py target/release/libturbovec.dylib -o turbovec.duckdb_extension
      - uses: actions/upload-artifact@v4
        with:
          name: turbovec-macos-arm64
          path: turbovec.duckdb_extension

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install OpenBLAS
        run: sudo apt-get update && sudo apt-get install -y libopenblas-dev
      - run: cargo build --release
      - run: python3 scripts/metadata.py target/release/libturbovec.so -o turbovec.duckdb_extension
      - uses: actions/upload-artifact@v4
        with:
          name: turbovec-linux-x86_64
          path: turbovec.duckdb_extension
