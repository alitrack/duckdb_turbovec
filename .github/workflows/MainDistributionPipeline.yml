name: Main Extension Distribution Pipeline

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.head_ref || '' }}-${{ github.base_ref || '' }}-${{ github.ref != 'refs/heads/master' || github.sha }}
  cancel-in-progress: true

jobs:
# ── Linux smoke test ────────────────────────────────────────────────────
  linux-amd64-smoke:
    name: Linux amd64 smoke
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - name: Install build deps
        run: |
          sudo apt-get update -y -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq make ninja-build jq libopenblas-dev
      - name: Configure
        run: make configure
      - name: Build
        run: make release
      - name: Verify
        run: |
          ls -la build/release/turbovec.duckdb_extension
          file build/release/turbovec.duckdb_extension

  macos-arm64-smoke:
    name: macOS arm64 smoke
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - name: Install build deps
        run: brew install ninja openblas
      - name: Configure
        run: make configure
      - name: Build
        run: |
          export OPENBLAS_LIB_DIR=$(brew --prefix openblas)/lib
          export OPENBLAS_INCLUDE_DIR=$(brew --prefix openblas)/include
          make release
      - name: Verify
        run: |
          ls -la build/release/turbovec.duckdb_extension
          file build/release/turbovec.duckdb_extension

# ── Docker embed (Linux manylinux-compatible) ───────────────────────────
  linux-docker-embed:
    name: Linux Docker embed build
    runs-on: ubuntu-24.04
    needs: [linux-amd64-smoke]
    if: success()
    env:
      DUCKDB_PLATFORM: linux_amd64
      VCPKG_TARGET_TRIPLET: x64-linux-release
      VCPKG_HOST_TRIPLET: x64-linux-release
      GEN: ninja
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
      - uses: actions/checkout@v4
        with:
          repository: duckdb/extension-ci-tools
          ref: v1.5-variegata
          path: extension-ci-tools
      - name: Build Docker image
        run: |
          docker build \
            --build-arg 'vcpkg_url=https://github.com/microsoft/vcpkg.git' \
            --build-arg 'vcpkg_commit=84bab45d415d22042bd0b9081aea57f362da3f35' \
            --build-arg 'extra_toolchains=;rust;' \
            -t duckdb/linux_amd64 \
            ./extension-ci-tools/docker/linux_amd64
      - name: Create env file
        run: |
          cat <<-'EOF' > docker_env.txt
          VCPKG_BINARY_SOURCES=clear;http,https://vcpkg-cache.duckdb.org,read
          VCPKG_TARGET_TRIPLET=x64-linux-release
          VCPKG_OVERLAY_TRIPLETS=/duckdb_build_dir/extension-ci-tools/toolchains
          VCPKG_OVERLAY_PORTS=/duckdb_build_dir/extension-ci-tools/vcpkg_ports
          DUCKDB_PLATFORM=linux_amd64
          DUCKDB_GIT_VERSION=v1.5.4
          ENABLE_EXTENSION_AUTOINSTALL=1
          ENABLE_EXTENSION_AUTOLOADING=1
          EXTENSION_NAME=turbovec
          LINUX_CI_IN_DOCKER=1
          GITHUB_ACTIONS=true
          CI=true
          CCACHE_MAXSIZE=1G
          CCACHE_NOCOMPRESS=1
          EOF
      - name: Install OpenBLAS in Docker
        run: |
          docker run --env-file=docker_env.txt -v `pwd`:/duckdb_build_dir duckdb/linux_amd64 \
            bash -c "apt-get update -qq && apt-get install -y -qq libopenblas-dev"
      - name: Run configure (outside Docker)
        env:
          DUCKDB_GIT_VERSION: v1.5.4
          LINUX_CI_IN_DOCKER: 0
        run: make configure_ci
      - name: Run configure (inside Docker)
        run: docker run --env-file=docker_env.txt -v `pwd`:/duckdb_build_dir duckdb/linux_amd64 make configure_ci
      - name: Build extension (inside Docker)
        run: docker run --env-file=docker_env.txt -v `pwd`:/duckdb_build_dir duckdb/linux_amd64 make release
      - name: Verify binary exists
        run: |
          ls -la ./build/release/turbovec.duckdb_extension
          file ./build/release/turbovec.duckdb_extension
          echo "=== Linux Docker embed build SUCCESS ==="

# ── Formal distribution (master push only) ──────────────────────────────
  duckdb-stable-build:
    name: Distribution
    needs: [linux-docker-embed, macos-arm64-smoke]
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_distribution.yml@v1.5-variegata
    with:
      duckdb_version: v1.5.4
      ci_tools_version: v1.5-variegata
      extension_name: turbovec
      extra_toolchains: rust
      exclude_archs: 'linux_arm64;wasm_mvp;wasm_eh;wasm_threads;windows_amd64;windows_amd64_mingw'
      skip_tests: true
    secrets: inherit
